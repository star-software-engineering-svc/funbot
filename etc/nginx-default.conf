# polybot B2 console: http://<host>/bot2-webui/ -> webui/server.py on 127.0.0.1:8790 (prefix stripped)
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	location = /bot2-webui {
		return 302 /bot2-webui/;
	}
	location /bot2-webui/ {
		proxy_pass http://127.0.0.1:8790/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;                     # the login lockout counts per address
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;                  # drives the session cookie Secure flag
		proxy_buffering off;
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
	# funbot web UI: http://<host>/funbot/ -> 127.0.0.1:8791 (prefix stripped; polybot's is 8790)
	location = /funbot {
		return 302 /funbot/;
	}
	location /funbot/ {
		proxy_pass http://127.0.0.1:8791/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Prefix /funbot;
		proxy_buffering off;
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
	location / {                                                  # any other path -> the web UI
		return 302 /bot2-webui/;
	}
}
